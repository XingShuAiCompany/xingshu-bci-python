[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xingshu-bci"
# The version is read from xingshu_bci.__version__ (single source of truth).
dynamic = ["version"]
description = "Official Python SDK for XingShu BCI: direct XingShuN1 Pro acquisition and the desktop platform local API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "XingShu BCI" }
]
keywords = ["bci", "eeg", "brainflow", "xingshu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "httpx>=0.27",
    "websocket-client>=1.7"
]

[project.optional-dependencies]
numpy = ["numpy>=1.23"]
device = ["numpy>=1.23"]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6"]

[tool.setuptools.dynamic]
version = { attr = "xingshu_bci.__version__" }

[project.urls]
Homepage = "https://github.com/XingShuAiCompany/xingshu-bci-python"
Documentation = "https://github.com/XingShuAiCompany/xingshu-bci-python/blob/main/docs/SDK.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xingshu_bci" = ["py.typed"]
