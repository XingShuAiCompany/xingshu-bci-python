      responses: { "200": { description: OK } }

  /v1/events:
    get:
      tags: [System]
      summary: WebSocket event stream (upgrade required).
      description: |
        Upgrade an HTTP request to WebSocket. Authenticate with the
        `Authorization: Bearer` header on the upgrade request (preferred; the
        official SDKs do this). The `?token=` query parameter is a fallback
        for clients that cannot set upgrade headers; when used, the token must
        be URL-encoded and the client should be aware that query strings can
        leak into logs and proxies. Optional `?events=samples,analysis`
        filters the event types pushed to the client.
        Each frame is a JSON envelope `{ type, seq, timestampMs, payload }`.
        `seq` restarts when the connection is re-established; events published
        while a client is disconnected are not replayed.
        A `samples` payload uses `SamplesEvent`; a `status` payload uses
        `ServerStatus`. XingShu N1 payloads distinguish deviceSampleRate from
        effectiveSampleRate, especially when BLE decimation is active.
        `experiment.trial.window` payloads use the `SsvepTrialWindow` schema and
        are sent only to the token that owns the selected external model.
      responses:
        "101": { description: Switching Protocols }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
